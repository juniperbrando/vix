name: VIX EOD Slack alert

on:
  schedule:
    # 21:30 UTC = 22:30 CET / 23:30 CEST — ~30 min after US close, every weekday
    - cron: '30 21 * * 1-5'
  workflow_dispatch:  # allow manual triggers from the GH UI / `gh workflow run`
    inputs:
      force:
        description: 'Post to Slack even if the tier has not changed'
        type: boolean
        default: false

# The job commits the last-seen tier back to the repo (state/last_tier) so the
# next run can tell whether the tier changed.
permissions:
  contents: write

jobs:
  vix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch VIX, classify, post to Slack on tier change
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # Shared curl hardening: fail fast on a stalled connection, retry transient
          # network blips (e.g. hooks.slack.com connect timeouts) instead of hanging
          # for curl's 300s default and failing the whole job on one hiccup.
          CURL_OPTS=(--fail-with-body --connect-timeout 15 --max-time 30 \
                     --retry 4 --retry-delay 5 --retry-all-errors --location)

          # 1. Fetch VIX from CBOE. Host moved cdn.cboe.com -> cdn-api.cboe.com in
          # Sep 2026 (old host now 307s); --location above follows any future move.
          response=$(curl -sS "${CURL_OPTS[@]}" 'https://cdn-api.cboe.com/api/global/delayed_quotes/quotes/_VIX.json')
          if ! jq -e '.data.current_price' <<<"$response" >/dev/null 2>&1; then
            echo "::error::CBOE did not return the expected JSON. First 300 bytes:"
            head -c 300 <<<"$response"; echo
            exit 1
          fi
          price=$(jq -r '.data.current_price'        <<<"$response")
          change=$(jq -r '.data.price_change'        <<<"$response")
          pct=$(jq -r '.data.price_change_percent'   <<<"$response")

          if [[ "$price" == "null" || -z "$price" ]]; then
            echo "VIX data missing from CBOE — aborting silently"
            exit 0
          fi

          # 2. Classify tier (the tier table in strategy.md)
          if   (( $(bc -l <<<"$price <= 14") )); then tier="Complacency"; emoji="🔴"; action="TRIM / sell";   ping=""
          elif (( $(bc -l <<<"$price <  20") )); then tier="Calm";        emoji="🟢"; action="Hold";          ping=""
          elif (( $(bc -l <<<"$price <  30") )); then tier="Elevated";    emoji="🟡"; action="Watch";         ping=""
          elif (( $(bc -l <<<"$price <  45") )); then tier="Fear";        emoji="🟠"; action="*BUY* SPY/QQQ"; ping="<!channel> "
          else                                        tier="Panic";       emoji="🚨"; action="*BUY MORE*";    ping="<!channel> "
          fi

          # 3. Compare with the tier from the previous run
          state_file=state/last_tier
          prev_tier=$(cat "$state_file" 2>/dev/null || echo "")
          formatted_price=$(printf "%.2f" "$price")
          echo "VIX close ${formatted_price} → tier: ${tier} (previous: ${prev_tier:-none})"

          if [[ "$tier" == "$prev_tier" && "${FORCE:-false}" != "true" ]]; then
            echo "Tier unchanged — nothing posted to Slack."
            exit 0
          fi

          # 4. Arrow + signed change/pct
          if   (( $(bc -l <<<"$change > 0") )); then arrow="▲"; signed_change=$(printf "+%.2f" "$change"); signed_pct=$(printf "+%.2f" "$pct")
          elif (( $(bc -l <<<"$change < 0") )); then arrow="▼"; signed_change=$(printf  "%.2f" "$change"); signed_pct=$(printf  "%.2f" "$pct")
          else                                       arrow="▬"; signed_change="0.00";                       signed_pct="0.00"
          fi

          # 5. Tier table (mirrors strategy.md), current tier marked with ◀︎
          mark() { [[ "$1" == "$tier" ]] && echo "   ◀︎ *now*" || echo ""; }
          table="\`  ≤ 14 \` 🔴 Complacency — TRIM / sell$(mark Complacency)
          \`14 – 20\` 🟢 Calm — Hold$(mark Calm)
          \`20 – 30\` 🟡 Elevated — Watch$(mark Elevated)
          \`30 – 45\` 🟠 Fear — BUY SPY/QQQ$(mark Fear)
          \`  ≥ 45 \` 🚨 Panic — BUY MORE$(mark Panic)"
          table=$(sed 's/^ *//' <<<"$table")

          # 6. Build message
          if [[ -n "$prev_tier" ]]; then
            headline="${ping}${emoji} *VIX tier changed:* ${prev_tier} → *${tier}*"
          else
            headline="${ping}${emoji} *VIX tier:* *${tier}* (first run, no previous tier on record)"
          fi
          nl=$'\n'
          message="${headline}${nl}📊 VIX EOD: \`${formatted_price}\`  (${arrow} ${signed_change}  ${signed_pct}%)${nl}👉 *Action: ${action}*${nl}${nl}_Tier table:_${nl}${table}"

          echo "---"
          echo "$message"
          echo "---"

          # 7. POST to Slack
          jq -n --arg text "$message" '{text: $text, mrkdwn: true}' \
            | curl -sS "${CURL_OPTS[@]}" -X POST -H 'Content-Type: application/json' \
                --data-binary @- "$SLACK_WEBHOOK_URL"
          echo

          # 8. Persist the new tier for the next run
          mkdir -p "$(dirname "$state_file")"
          echo "$tier" > "$state_file"

      - name: Commit updated tier state
        run: |
          if git diff --quiet -- state/ && [[ -z "$(git ls-files --others --exclude-standard state/)" ]]; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name  "vix-bot"
          git config user.email "vix-bot@users.noreply.github.com"
          git add state/
          git commit -m "state: last tier → $(cat state/last_tier)"
          git push
